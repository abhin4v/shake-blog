name: Build blog

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-26.04
    env:
      NIXPKGS_BRANCH: release-26.05
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          ref: main

      - name: resolve nixpkgs commit
        id: nixpkgs
        run: |
          set -euo pipefail
          SHA=$(git ls-remote https://github.com/NixOS/nixpkgs.git "refs/heads/$NIXPKGS_BRANCH" | cut -f1)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: cache blog bundle
        id: cache-blog
        uses: actions/cache@v5
        with:
          path: ~/.cache/magix-bundles
          key: magix-bundles-${{ hashFiles('blog.hs') }}-${{ steps.nixpkgs.outputs.sha }}

      - name: install Nix
        if: steps.cache-blog.outputs.cache-hit != 'true'
        uses: DeterminateSystems/nix-installer-action@v22
        with:
          extra-conf: |
            extra-substituters = https://dschrempf-magix.cachix.org
            extra-trusted-public-keys = dschrempf-magix.cachix.org-1:cScG6NjZBiQvY7KjSPpQdUa9UXZVLz9rvUZHtuwdYwc=

      - name: install magix
        if: steps.cache-blog.outputs.cache-hit != 'true'
        run: nix profile install github:dschrempf/magix

      - name: compile blog
        if: steps.cache-blog.outputs.cache-hit != 'true'
        env:
          MAGIX_NIXPKGS_REF: github:NixOS/nixpkgs/${{ steps.nixpkgs.outputs.sha }}
        run: ./blog.hs

      - name: create bundle
        if: steps.cache-blog.outputs.cache-hit != 'true'
        run: ./scripts/magix-bundle.sh bundle blog.hs

      - name: restore site build cache
        id: cache-site
        uses: actions/cache/restore@v5
        with:
          path: |
            _site
            .shake
          key: site-build-${{ steps.nixpkgs.outputs.sha }}-${{ hashFiles('posts/**', 'templates/**', 'css/**', 'images/**', 'config.yaml', 'blog.hs') }}
          restore-keys: site-build-${{ steps.nixpkgs.outputs.sha }}-

      - name: build site
        run: ENV=PROD ./scripts/magix-bundle.sh run blog.hs -j4 --color --digest --prune build

      - name: check CNAME
        run: |
          set -euxo pipefail
          if [ -f CNAME ] && [ ! -s CNAME ]; then
            echo "::warning::CNAME file exists but is empty; ignoring"
            rm CNAME
          fi

      - name: copy CNAME
        run: |
          set -euxo pipefail
          [ -f CNAME ] && cp CNAME _site/CNAME || true

      - name: add .nojekyll
        run: touch _site/.nojekyll

      - name: save site build cache
        if: steps.cache-site.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: |
            _site
            .shake
          key: site-build-${{ steps.nixpkgs.outputs.sha }}-${{ hashFiles('posts/**', 'templates/**', 'css/**', 'images/**', 'config.yaml', 'blog.hs') }}

      - name: publish
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: gh-pages
          build_dir: _site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
